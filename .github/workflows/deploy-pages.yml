name: Publicar no GitHub Pages

on:
  # Roda a cada push na branch principal
  push:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions" do GitHub
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Cancela deploys em andamento se um novo push chegar,
# para não acumular publicações duplicadas
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build de produção
        # --base=./ gera caminhos RELATIVOS no build (assets, ícones, imagens),
        # essencial para servir o site a partir de um subcaminho, como
        # https://usuario.github.io/nome-do-repo/
        run: npx vite build --base=./

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar o artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
