name: Publicar no GitHub Pages

on:
  # Roda a cada push na branch principal
  push:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions" do GitHub
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages.
# "contents: write" também permite commitar o package-lock.json
# gerado no CI quando ele ainda não existe no repositório.
permissions:
  contents: write
  pages: write
  id-token: write

# Cancela deploys em andamento se um novo push chegar,
# para não acumular publicações duplicadas
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # O cache npm só é ativado quando o package-lock.json já existe;
          # sem essa condição o setup-node falha com o erro
          # "Dependencies lock file is not found in /home/runner/work/..."
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Garantir o package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json não encontrado — gerando a partir do package.json"
            npm install --package-lock-only
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: adicionar package-lock.json gerado no CI"
            git push origin HEAD || echo "aviso: não foi possível enviar o lockfile ao repositório; o build continua com o lockfile gerado localmente"
          else
            echo "package-lock.json já existe no repositório"
          fi

      - name: Instalar dependências
        # npm ci instala exatamente o que está no package-lock.json,
        # gerado no passo anterior caso ainda não existisse
        run: npm ci

      - name: Gerar o build de produção
        # --base=./ gera caminhos RELATIVOS no build (assets, ícones, imagens),
        # essencial para servir o site a partir de um subcaminho, como
        # https://usuario.github.io/nome-do-repo/
        run: npx vite build --base=./

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar o artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
